name: Update Sitemap XML

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Crawler & Generate Sitemap
        run: |
          python crawler.py

      - name: Validate Sitemap XML
        run: |
          python validate_sitemap.py sitemap.xml

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt audit_report.json
          if git diff --staged --quiet; then
            echo "No changes in sitemap or robots.txt"
          else
            git commit -m "chore(seo): automated sitemap.xml and robots.txt refresh [skip ci]"
            git push
          fi
