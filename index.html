<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajar en un Click - Sitemap & SEO</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #00b4d8;
      --text: #f8f9fa;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1c2541, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: var(--accent);
    }
    p {
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: block;
      padding: 12px 20px;
      background: rgba(0, 180, 216, 0.15);
      border: 1px solid rgba(0, 180, 216, 0.3);
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    a:hover {
      background: rgba(0, 180, 216, 0.35);
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      font-size: 12px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✈️ Viajar en un Click</h1>
    <p>Directorio de recursos SEO y Sitemap XML oficial para motores de búsqueda.</p>
    
    <div class="links">
      <a href="sitemap.xml" target="_blank">📄 Ver sitemap.xml (153 URLs)</a>
      <a href="robots.txt" target="_blank">🤖 Ver robots.txt</a>
      <a href="audit_report.json" target="_blank">📊 Ver informe de rastreo JSON</a>
    </div>

    <div class="badge">
      ✓ Conforme a Sitemaps.org 0.9 & Google Search Console
    </div>
  </div>
</body>
</html>
